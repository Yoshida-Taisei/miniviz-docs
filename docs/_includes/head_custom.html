<!-- Custom head include to load custom.css for reducing sidebar padding -->
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

{% comment %} 現在のページの言語（ja か en）を特定 {% endcomment %}
{% assign url_parts = page.url | split: "/" %}
{% if url_parts[1] == "en" %}
  {% assign current_lang = "en" %}
{% else %}
  {% assign current_lang = "ja" %}
{% endif %}

<script>
(function() {
  // Liquidテンプレートから言語情報を取得
  var currentLang = '{{ current_lang }}';
  
  function replaceSidebarWithTOC() {
    var sidebar = document.querySelector('.side-bar');
    if (!sidebar) {
      console.log('Sidebar not found');
      return;
    }
    
    // まず、既存のカスタム目次を削除（重複防止）
    var existingTOC = sidebar.querySelector('.custom-toc');
    if (existingTOC) {
      existingTOC.remove();
    }
    
    // サイドバーのナビゲーションを非表示にする
    var siteNav = sidebar.querySelector('.site-nav');
    if (siteNav) {
      siteNav.style.display = 'none';
    }
    
    // 目次を探す（h2タグのIDまたはテキストで検索）
    var tocHeading = null;
    var headings = document.querySelectorAll('h2');
    for (var i = 0; i < headings.length; i++) {
      var heading = headings[i];
      var text = heading.textContent.trim();
      var id = heading.getAttribute('id') || '';
      // IDまたはテキストで目次を検索
      if (id.indexOf('目次') !== -1 || id.indexOf('table-of-contents') !== -1 || 
          text === '目次' || text === 'Table of Contents') {
        tocHeading = heading;
        break;
      }
    }
    
    if (!tocHeading) {
      console.log('TOC heading not found');
      return;
    }
    
    // 目次のulリストを取得（h2の次のul要素）
    var tocList = tocHeading.nextElementSibling;
    while (tocList && tocList.tagName !== 'UL') {
      tocList = tocList.nextElementSibling;
    }
    
    if (!tocList) {
      console.log('TOC list not found');
      return;
    }
    
    // カスタム目次コンテナを作成
    var customTOC = document.createElement('div');
    customTOC.className = 'custom-toc';
    
    // タイトルを追加
    var title = document.createElement('h3');
    title.textContent = currentLang === 'ja' ? '目次' : 'Table of Contents';
    customTOC.appendChild(title);
    
    // 目次のリストをクローンして追加
    var clonedList = tocList.cloneNode(true);
    customTOC.appendChild(clonedList);
    
    // リンクの相対パスを現在の言語パスに変換
    var links = customTOC.querySelectorAll('a');
    links.forEach(function(link) {
      var href = link.getAttribute('href');
      if (href && !href.startsWith('http') && !href.startsWith('/')) {
        // 相対パスを現在の言語パスに変換
        var newHref = '/' + currentLang + '/' + href;
        link.setAttribute('href', newHref);
      }
    });
    
    // サイドバーのヘッダーの後に挿入
    var siteHeader = sidebar.querySelector('.site-header');
    if (siteHeader && siteHeader.nextSibling) {
      siteHeader.parentNode.insertBefore(customTOC, siteHeader.nextSibling);
    } else if (siteHeader) {
      siteHeader.parentNode.appendChild(customTOC);
    } else {
      sidebar.insertBefore(customTOC, sidebar.firstChild);
    }
  }

  // DOMContentLoadedを待って実行
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(replaceSidebarWithTOC, 50);
    });
  } else {
    setTimeout(replaceSidebarWithTOC, 50);
  }
  
  // 念のため少し遅れて再実行
  setTimeout(replaceSidebarWithTOC, 200);
  setTimeout(replaceSidebarWithTOC, 500);
})();

// ヘッダーの「Home」リンクを現在の言語のindexページに変更
(function() {
  function updateHomeLink() {
    var auxNav = document.querySelector('.aux-nav');
    if (!auxNav) return;
    
    // 現在の言語に応じたindexリンクを取得
    var currentLang = '{{ current_lang }}';
    var indexUrl = '/' + currentLang + '/';
    
    // 「Home」リンクを探して更新
    var links = auxNav.querySelectorAll('.aux-nav-list-item a');
    links.forEach(function(link) {
      var text = link.textContent.trim();
      if (text === 'Home' || text === 'Miniviz Home') {
        link.href = indexUrl;
        link.textContent = 'Home';
      }
    });
  }
  
  // 実行
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateHomeLink);
  } else {
    updateHomeLink();
  }
})();
</script>
